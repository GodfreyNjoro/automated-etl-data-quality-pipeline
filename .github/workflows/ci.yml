name: CI

# Run the full quality gate on every push to main and on pull requests
# targeting main, so regressions are caught before they are merged.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint & test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported interpreters. The project's dependencies (pydantic 2.13+)
        # require Python 3.10 or newer.
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint and check import ordering (ruff)
        run: ruff check .

      - name: Run the test suite with coverage
        run: pytest --cov=src --cov-report=term-missing --cov-fail-under=80

      - name: Smoke-test the end-to-end example
        run: python examples/retail_aggregation/run_example.py --no-metadata
